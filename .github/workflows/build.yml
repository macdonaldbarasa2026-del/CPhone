name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build CPhone APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android Build Tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cphone-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Release Latest APK
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "CPhone Studio v2.0 Latest APK"
          body: "CPhone Commercial Mobile IDE v2.0: Code Trails (Symbol Outline, Breadcrumbs, Cursor History), Live Bug & Syntax Inspector with Gutter Radar, Fixed Python 3 (Skulpt + Stdin + Turtle), TypeScript/JS V8 Runner, Multi-Tab HTML/CSS/JS Bundler, Command Palette, Auto-Formatter, 6 IDE Themes, and Calibrated Compact Android Dock."
          files: app/build/outputs/apk/debug/*.apk
          prerelease: false
